<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="quizify-version" content="{{VERSION}}">
    <meta name="quizify-ha-lang" content="{{HA_LANG}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quizify — Dashboard</title>

    <!-- Soft Parlor fonts: Cabinet Grotesk (display) + DM Sans (body) + JetBrains Mono (numeric) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/quizify/static/css/styles.css?v={{ASSET_VER}}">
    <link rel="icon" href="/quizify/static/img/icon-256.png" type="image/png">
    <link rel="manifest" href="/quizify/static/site.webmanifest">

    <!-- Soft Parlor: no confetti. A gentle champion reveal with warm light IS the effect. See DESIGN.md. -->

    <style>
        /* ==========================================
           Dashboard — TV Host (Soft Parlor)
           The signature surface. Cream paper, coral + sage accents,
           warm ink. Soft shadows, rounded edges. No confetti.
           See DESIGN.md.
           ========================================== */

        :root {
            /* Broadcast Living Room tokens (duplicated here so dashboard is
               self-contained and survives if styles.css drifts). */
            --dash-bg-primary: #FAF6EC;              /* cream paper */              /* studio navy */
            --dash-accent-primary: #E88A7F;          /* warm coral */          /* broadcast gold */
            --dash-accent-secondary: #7FA897;        /* muted sage */        /* single accent — aliased */
            --dash-surface-dark: #FFFFFF;            /* lifted paper */            /* lifted card */
            --dash-surface-2: #F3EEDF;               /* cream tint */               /* modals, hover */
            --dash-border-neon: #E5DFCF;             /* warm hairline */             /* hairline */
            --dash-text-neon-muted: #6E6A5C;         /* warm olive-gray */         /* cool blue-gray */
            --dash-text-white: #2A2820;              /* dark ink on cream */              /* warm parchment, NOT white */
            --dash-success: #7FA897;                 /* sage for correct */                 /* correct = gold */
            --dash-success-glow: rgba(127, 168, 151, 0.35);
            --dash-error: #D66A6A;                   /* warm red */
            --dash-warning: #E8C47F;                 /* sun */
            --dash-gold: #E8C47F;                    /* sun for podium 1st */
            --dash-silver: #B8B2A0;                  /* warm silver */
            --dash-bronze: #C99466;                  /* warm bronze */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body.dashboard-body {
            background: var(--dash-bg-primary);
            background-image:
                linear-gradient(var(--dash-bg-primary), var(--dash-bg-primary)),
                radial-gradient(ellipse at 85% 15%, rgba(232, 138, 127, 0.08) 0%, transparent 55%);
            background-blend-mode: normal;
            color: var(--dash-text-white);
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            min-height: 100dvh;
        }

        /* ---- Main Container ---- */
        .dashboard-container {
            max-width: 100%;
            width: 100%;
            height: 100dvh;
            padding: clamp(24px, 3vw, 48px) clamp(24px, 3vw, 48px);
            display: flex;
            flex-direction: column;
        }

        /* ---- Dashboard Views ---- */
        .dashboard-view { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .dashboard-view.active { display: flex; }

        /* ---- Wordmark ---- */
        .wordmark {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: clamp(24px, 2.4vw, 34px);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .wordmark-quiz { color: var(--dash-text-white); }
        .wordmark-ify  { color: var(--dash-accent-primary); }

        /* ---- Dashboard Header ---- */
        .dashboard-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding-bottom: 20px;
            flex-shrink: 0;
        }

        .dashboard-round {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--dash-accent-primary);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 8px 0 6px;
            border-bottom: 1px solid var(--dash-accent-primary);
            margin-top: 6px;
        }

        /* ---- Timer Bar ---- */
        .dashboard-timer {
            position: relative;
            height: 4px;
            background: var(--dash-border-neon);
            border-radius: 2px;
            flex-shrink: 0;
            margin-bottom: clamp(20px, 2.4vw, 32px);
            overflow: hidden;
        }

        .dashboard-timer-fill {
            height: 100%;
            background: var(--dash-accent-primary);
            box-shadow: 0 0 12px var(--dash-success-glow);
            border-radius: 2px;
            transition: width 0.8s linear;
            width: 100%;
        }

        .dashboard-timer-fill.warning {
            background: var(--dash-warning);
        }

        .dashboard-timer-fill.critical {
            background: var(--dash-error);
            box-shadow: 0 0 16px rgba(214, 106, 106, 0.28);
            animation: pulse-bar 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse-bar {
            from { opacity: 1; }
            to   { opacity: 0.5; }
        }

        /* ===================
           LOADING / NO-GAME / WAITING
           =================== */
        .dashboard-loading,
        .dashboard-no-game,
        .dashboard-waiting {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .dashboard-loading .wordmark,
        .dashboard-no-game .wordmark,
        .dashboard-waiting .wordmark { font-size: clamp(40px, 5vw, 64px); }

        .dashboard-loading-text,
        .dashboard-waiting-text {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 14px;
            color: var(--dash-text-neon-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: fade-pulse 2s ease-in-out infinite;
        }

        @keyframes fade-pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .dashboard-no-game-title {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dash-text-white);
            letter-spacing: -0.01em;
        }

        .dashboard-no-game-subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--dash-text-neon-muted);
        }

        .dashboard-qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .dashboard-qr-section canvas,
        .dashboard-qr-section img {
            border-radius: 10px;
            border: 1px solid var(--dash-border-neon);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .dashboard-player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 800px;
        }

        .dashboard-player-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-radius: 9999px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--dash-text-white);
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* ===================
           TWO-COLUMN LAYOUT (question + leaderboard)
           =================== */
        .dashboard-columns {
            display: flex;
            flex: 1;
            gap: clamp(24px, 3vw, 40px);
            min-height: 0;
        }

        /* Left: question + answers */
        .dashboard-left {
            flex: 6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .dashboard-category {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--dash-accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--dash-accent-primary);
            display: inline-block;
            align-self: flex-start;
        }

        .dashboard-question {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: clamp(32px, 4.2vw, 56px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--dash-text-white);
            margin-bottom: clamp(24px, 3vw, 40px);
            max-width: 24ch;
        }

        /* Issue #25: optional question image, rendered above the text.
           Capped height so a tall image can't push the answers grid
           off-screen on a 720p TV; object-fit keeps the aspect ratio. */
        .dashboard-question-image {
            display: block;
            max-width: 100%;
            max-height: clamp(160px, 28vh, 320px);
            width: auto;
            border-radius: 16px;
            margin-bottom: clamp(16px, 2vw, 28px);
            object-fit: contain;
        }
        .dashboard-question-image[hidden] { display: none; }

        /* 3-column answer row (questions have exactly 3 answers) */
        .dashboard-answers {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: clamp(12px, 1.4vw, 18px);
        }

        .dashboard-answer {
            display: flex;
            align-items: center;
            gap: clamp(14px, 1.6vw, 20px);
            padding: clamp(16px, 1.8vw, 24px) clamp(18px, 2vw, 28px);
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(16px, 1.8vw, 22px);
            font-weight: 500;
            color: var(--dash-text-white);
            transition: border-color 120ms ease-out, background 120ms ease-out, box-shadow 320ms ease-out;
            min-height: 80px;
        }

        .dashboard-answer .answer-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 500;
            color: var(--dash-accent-primary);
            flex-shrink: 0;
            width: auto;
            height: auto;
            background: transparent;
            line-height: 1;
        }

        /* Correct-answer reveal */
        .dashboard-answer.correct {
            border-color: var(--dash-success);
            background: rgba(127, 168, 151, 0.10);
            position: relative;
        }

        .dashboard-answer.correct::after {
            content: "★";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dash-success);
            font-size: 16px;
        }

        .dashboard-answer.wrong {
            opacity: 0.32;
        }

        /* Answer-distribution chart (issue #151) — hidden during question,
           fades in + animates the bars at reveal time. TV viewing distance
           means: thick bars, large percent text, no precision noise. The
           bar is sized to claim ~30 % of the answer-row width so the
           answer text still owns the card. */
        .dashboard-answer-distribution {
            display: flex;
            align-items: center;
            gap: clamp(10px, 1vw, 14px);
            margin-left: auto;
            opacity: 0;
            transition: opacity 220ms ease-out 320ms;  /* fade in after correct/wrong colour lands */
            min-width: clamp(140px, 22%, 280px);
            flex-shrink: 0;
        }
        .dashboard-answer.revealed .dashboard-answer-distribution {
            opacity: 1;
        }
        .dashboard-answer-bar {
            flex: 1 1 auto;
            height: clamp(10px, 1vw, 14px);
            background: #E5DFCF;
            border-radius: 999px;
            overflow: hidden;
        }
        .dashboard-answer-bar-fill {
            height: 100%;
            width: 0%;
            background: rgba(127, 168, 151, 0.42);  /* sage muted for wrong */
            border-radius: 999px;
            transition: width 800ms cubic-bezier(0.22, 0.61, 0.36, 1) 400ms;
        }
        .dashboard-answer.correct .dashboard-answer-bar-fill {
            background: var(--dash-success);  /* sage green per DESIGN.md */
        }
        .dashboard-answer-percent {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: clamp(16px, 1.6vw, 22px);
            font-weight: 600;
            color: var(--dash-text-white);
            min-width: clamp(48px, 4.5vw, 72px);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Fun fact on reveal */
        .dashboard-funfact {
            margin-top: clamp(24px, 3vw, 36px);
            padding: 20px 24px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-left: 3px solid var(--dash-accent-primary);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--dash-text-neon-muted);
            transform: translateY(16px);
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .dashboard-funfact.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .dashboard-funfact .fun-fact-label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dash-accent-primary);
            margin-bottom: 8px;
        }

        .dashboard-funfact .fun-fact-text {
            color: var(--dash-text-white);
        }

        /* Right: leaderboard */
        .dashboard-right {
            flex: 4;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dashboard-leaderboard-title {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dash-text-neon-muted);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--dash-border-neon);
        }

        .dashboard-leaderboard {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dashboard-leaderboard .leaderboard-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--dash-text-white);
            transition: border-color 120ms ease-out, background 120ms ease-out;
        }

        .dashboard-leaderboard .leaderboard-rank {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--dash-text-neon-muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .dashboard-leaderboard .leaderboard-rank.rank-1 { color: var(--dash-gold); }
        .dashboard-leaderboard .leaderboard-rank.rank-2 { color: var(--dash-silver); }
        .dashboard-leaderboard .leaderboard-rank.rank-3 { color: var(--dash-bronze); }

        .dashboard-leaderboard .leaderboard-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .dashboard-leaderboard .leaderboard-score {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--dash-accent-primary);
            font-variant-numeric: tabular-nums;
        }

        .dashboard-leaderboard .leaderboard-streak {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--dash-accent-primary);
            padding: 2px 8px;
            background: rgba(232, 138, 127, 0.10);
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        /* ===================
           FINALE / PODIUM — single spotlight, no confetti
           =================== */
        .dashboard-finale {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding-top: 12px;
            padding-bottom: 16px;
            gap: 12px;
            position: relative;
        }

        /* Two-column finale (msg 326 option 1). Podium on the left, awards
           + leaderboard on the right — both columns share the available
           vertical room instead of stacking, so the awards row and the
           leaderboard land above the fold on a 720p TV. */
        .dashboard-finale--split {
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: clamp(24px, 3vw, 48px);
            padding: 16px clamp(16px, 3vw, 40px);
        }
        .dashboard-finale-left {
            /* Podium owns the showcase real estate, so give it more
               room than the awards/leaderboard column (~58/42 split).
               min-width: 0 lets the flex item actually shrink. */
            flex: 1.4 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .dashboard-finale-right {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
            max-height: 100%;
            overflow: hidden;
        }
        /* On split layout the side panel for 4+ players stacks UNDER the
           podium instead of beside it — the left column is already tight. */
        .dashboard-finale--split .podium-wrap {
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        /* Constrain podium width so the bars stay inside the left column. */
        .dashboard-finale--split .podium {
            min-height: 200px;
            gap: clamp(12px, 1.4vw, 24px);
        }
        .dashboard-finale--split .podium-bar {
            width: clamp(72px, 8vw, 110px);
        }
        /* Awards row stacks vertically inside the right column on the
           split layout — pill cards still read TV-legibly. */
        .dashboard-finale--split .awards-section {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        .dashboard-finale--split .awards-grid {
            flex-direction: column;
            align-items: stretch;
        }
        .dashboard-finale--split .award-card {
            min-width: 0;
            width: 100%;
        }
        .dashboard-finale--split .finale-leaderboard-card {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .dashboard-finale::before {
            /* Single spotlight from above — replaces confetti */
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, var(--dash-success-glow) 0%, transparent 45%);
            pointer-events: none;
            opacity: 0;
            animation: spotlight-in 0.8s ease-out 0.2s forwards;
        }

        @keyframes spotlight-in {
            to { opacity: 1; }
        }

        .podium-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 28 → 12 to give the awards row room on 720p TVs. */
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .podium-title {
            font-family: 'Cabinet Grotesk', sans-serif;
            /* clamp top dropped 72 → 48 so 'Result' is still TV-legible
               but stops dominating the awards-row vertical budget. */
            font-size: clamp(28px, 3.6vw, 48px);
            font-weight: 900;
            color: var(--dash-accent-primary);
            letter-spacing: -0.02em;
            line-height: 1;
            text-shadow: 0 0 40px var(--dash-success-glow);
        }

        /* Podium row: labels (medal + name + score) hover at the top in a
           single horizontal line, bars grow down to a shared baseline so the
           bottom edge is visually flush. Per Markus 2026-05-29 (msg 320):
           previously the medal+name+score sat directly above each bar, which
           meant the label rows were staircased (label-of-1st sat much higher
           than label-of-3rd). With `justify-content: space-between` + fixed
           total height per .podium-place, labels align across columns and
           bars still stand on the same floor. */
        .podium-wrap {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: clamp(20px, 3vw, 48px);
            width: 100%;
        }
        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 280px;
            gap: clamp(20px, 2.4vw, 40px);
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* 280 → 220 so the awards row stays above the fold on 720p TVs. */
            height: 220px;
            gap: 8px;
        }
        .podium-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Side panel for players beyond the top 3 — appears to the right
           of the podium with a quiet ranked list. Per Markus 2026-05-29
           (msg 320). Hidden when there are ≤ 3 players. */
        .podium-others {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            max-width: 280px;
            margin-top: 16px;
        }
        .podium-others-title {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dash-text-neon-muted);
            margin-bottom: 4px;
        }
        .podium-other-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            color: var(--dash-text-white);
        }
        .podium-other-rank {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            color: var(--dash-text-neon-muted);
            font-size: 12px;
            min-width: 24px;
        }
        .podium-other-name {
            flex: 1 1 auto;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .podium-other-score {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            color: var(--dash-accent-primary);
            font-variant-numeric: tabular-nums;
        }

        .podium-avatar {
            font-size: 2rem;
            line-height: 1;
        }

        .podium-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dash-text-white);
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        .podium-score {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--dash-accent-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.04em;
        }

        .podium-bar {
            width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            border-radius: 0;
            color: var(--dash-text-neon-muted);
            background: var(--dash-surface-dark);
            border-top: 3px solid var(--dash-bronze);
        }

        /* Bar heights stay proportional but scaled down — fits in the
           220 px podium-place height with room for the top label. */
        .podium-bar.first {
            height: 150px;
            border-top: 3px solid var(--dash-accent-primary);
            color: var(--dash-accent-primary);
            box-shadow: 0 -20px 40px var(--dash-success-glow);
        }

        .podium-bar.second {
            height: 122px;
            border-top: 3px solid var(--dash-silver);
            color: var(--dash-silver);
        }

        .podium-bar.third {
            height: 102px;
            border-top: 3px solid var(--dash-bronze);
            color: var(--dash-bronze);
        }

        /* Awards / Superlatives */
        .awards-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .awards-section.hidden { display: none; }

        .awards-title {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--dash-accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--dash-accent-primary);
        }

        .awards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .award-card {
            /* Compact horizontal pill — fits the awards row above the
               fold at 720p TV viewport. Per Markus 2026-05-29 (msg 323):
               the previous tall vertical card forced the row off-screen.
               Icon + name + winner now sit on a single line; the longer
               detail string sits as a quiet second line under the
               winner so a long fact still has room. */
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-radius: 999px;
            min-width: 220px;
            text-align: left;
            opacity: 0;
            transform: translateY(20px);
            animation: award-appear 0.5s ease forwards;
        }
        .award-card .award-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        @keyframes award-appear {
            to { opacity: 1; transform: translateY(0); }
        }

        .award-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }

        .award-name {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--dash-accent-primary);
        }

        .award-winner {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--dash-text-white);
        }

        .award-detail {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--dash-text-neon-muted);
        }

        /* Finale leaderboard card */
        .finale-leaderboard-card {
            width: 100%;
            max-width: 640px;
            background: var(--dash-surface-dark);
            border: 1px solid var(--dash-border-neon);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .finale-leaderboard-card .card-header {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dash-text-neon-muted);
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--dash-border-neon);
        }

        .finale-leaderboard-card .dashboard-leaderboard {
            padding: 8px;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .dashboard-columns { flex-direction: column; gap: 20px; }
            .dashboard-question { font-size: 28px; }
            .dashboard-answers { grid-template-columns: 1fr; }
            .dashboard-answer { font-size: 16px; padding: 14px 16px; min-height: 56px; }
        }
    </style>
</head>
<body class="dashboard-body">

    <main class="dashboard-container">
        <div class="dashboard-header">
            <h1 class="wordmark">
                <span class="wordmark-quiz">Quiz</span><span class="wordmark-ify">ify</span>
            </h1>
            <div id="round-indicator" class="dashboard-round"></div>
        </div>

        <div id="timer-bar" class="dashboard-timer">
            <div id="timer-fill" class="dashboard-timer-fill" style="width:0%"></div>
        </div>

        <!-- WAITING VIEW -->
        <div id="waiting-view" class="dashboard-view active">
            <div class="dashboard-waiting">
                <h1 class="wordmark" style="font-size:3rem;">
                    <span class="wordmark-quiz">Quiz</span><span class="wordmark-ify">ify</span>
                </h1>
                <p class="dashboard-waiting-text" data-i18n="dashboard.waitingForStart">Waiting for game to start…</p>
            </div>
        </div>

        <!-- QUESTION VIEW -->
        <div id="question-view" class="dashboard-view">
            <div class="dashboard-columns">
                <div class="dashboard-left">
                    <div id="question-category" class="dashboard-category"></div>
                    <img id="question-image" class="dashboard-question-image" alt="" hidden />
                    <div id="question-text" class="dashboard-question"></div>
                    <div id="answers-grid" class="dashboard-answers"></div>
                    <div id="fun-fact" class="dashboard-funfact">
                        <div class="fun-fact-label" data-i18n="dashboard.didYouKnow">Did you know?</div>
                        <div id="fun-fact-text" class="fun-fact-text"></div>
                    </div>
                </div>
                <div class="dashboard-right">
                    <div class="dashboard-leaderboard-title" data-i18n="dashboard.leaderboard">Leaderboard</div>
                    <div id="leaderboard" class="dashboard-leaderboard"></div>
                </div>
            </div>
        </div>

        <!-- FINALE VIEW -->
        <div id="finale-view" class="dashboard-view">
            <!-- v1.1.47 (msg 326 option 1): two-column finale so the awards
                 row and final leaderboard sit beside the podium instead of
                 stacking below it. On a 720p TV the previous stacked layout
                 pushed the awards row off-screen even after aggressive
                 vertical-spacing cuts. Side-by-side fits cleanly. -->
            <div class="dashboard-finale dashboard-finale--split">
                <div class="dashboard-finale-left">
                    <div class="podium-section">
                        <div class="podium-title" data-i18n="dashboard.result">Result</div>
                        <div class="podium-wrap">
                            <div id="podium" class="podium"></div>
                            <div id="podium-others" class="podium-others" hidden></div>
                        </div>
                    </div>
                </div>
                <div class="dashboard-finale-right">
                    <div id="awards-section" class="awards-section hidden"></div>
                    <div class="finale-leaderboard-card">
                        <div class="card-header" data-i18n="dashboard.leaderboard">Leaderboard</div>
                        <div id="finale-leaderboard" class="dashboard-leaderboard"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/quizify/static/js/i18n.js?v={{ASSET_VER}}"></script>
    <script src="/quizify/static/js/utils.js?v={{ASSET_VER}}"></script>
    <script>
    (function() {
        'use strict';

        // ---- State ----
        var ws = null;
        var timerDuration = 30;
        var timerRemaining = 0;
        var currentAnswers = [];

        // ---- DOM ----
        var views = {
            waiting: document.getElementById('waiting-view'),
            question: document.getElementById('question-view'),
            finale: document.getElementById('finale-view'),
        };
        var els = {
            roundIndicator: document.getElementById('round-indicator'),
            timerFill: document.getElementById('timer-fill'),
            questionCategory: document.getElementById('question-category'),
            questionImage: document.getElementById('question-image'),
            questionText: document.getElementById('question-text'),
            answersGrid: document.getElementById('answers-grid'),
            leaderboard: document.getElementById('leaderboard'),
            funFact: document.getElementById('fun-fact'),
            funFactText: document.getElementById('fun-fact-text'),
            podium: document.getElementById('podium'),
            finaleLeaderboard: document.getElementById('finale-leaderboard'),
        };

        function showView(name) {
            Object.values(views).forEach(function(v) { v.classList.remove('active'); });
            if (views[name]) views[name].classList.add('active');
        }

        // Issue #25: render the optional question image. Only absolute
        // http(s) URLs are accepted (the server already sanitises, this
        // is a defence-in-depth check). Absent/invalid → element hidden,
        // layout collapses cleanly to the text-only question.
        function renderQuestionImage(url) {
            var img = els.questionImage;
            if (!img) return;
            var safe = (typeof url === 'string' && /^https?:\/\//i.test(url)) ? url : '';
            if (safe) {
                img.src = safe;
                img.hidden = false;
            } else {
                img.removeAttribute('src');
                img.hidden = true;
            }
        }

        // ---- WebSocket ----
        function connect() {
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var url = proto + '//' + location.host + '/api/quizify/ws?role=dashboard';
            ws = new WebSocket(url);

            ws.onopen = function() {
                ws.send(JSON.stringify({ type: 'get_state' }));
            };

            ws.onmessage = function(evt) {
                try {
                    handleMessage(JSON.parse(evt.data));
                } catch(e) {
                    console.error('[Dashboard] Bad message:', e);
                }
            };

            ws.onclose = function() {
                ws = null;
                setTimeout(connect, 2000);
            };

            ws.onerror = function() { if (ws) ws.close(); };
        }

        // ---- Message handler ----
        function handleMessage(msg) {
            switch (msg.type || msg.event) {
                case 'game_state':
                    handleGameState(msg);
                    break;
                case 'question_started':
                    handleQuestionStarted(msg);
                    break;
                case 'timer_tick':
                    handleTimerTick(msg);
                    break;
                case 'round_summary':
                case 'round_evaluated':
                    handleRoundSummary(msg);
                    break;
                case 'leaderboard_update':
                    if (msg.leaderboard) renderLeaderboard(els.leaderboard, msg.leaderboard);
                    break;
                case 'finale':
                case 'game_ended':
                    handleFinale(msg);
                    break;
                case 'game_reset':
                    showView('waiting');
                    els.roundIndicator.textContent = '';
                    els.timerFill.style.width = '0%';
                    break;
                case 'player_joined':
                case 'player_left':
                    break;
            }
        }

        function handleGameState(msg) {
            if (msg.leaderboard) renderLeaderboard(els.leaderboard, msg.leaderboard);

            switch (msg.phase) {
                case 'LOBBY':
                    showView('waiting');
                    break;
                case 'QUESTION_ACTIVE':
                    if (msg.question) {
                        handleQuestionStarted({
                            question_text: msg.question.text,
                            answers: msg.question.answers,
                            timer_duration: msg.question.time_limit,
                            round_num: msg.round,
                            total_rounds: msg.total_rounds,
                            category: msg.question.category,
                            image_url: msg.question.image_url,
                        });
                    } else {
                        showView('question');
                    }
                    break;
                case 'ANSWER_REVEAL':
                    showView('question');
                    break;
                case 'FINALE':
                    handleFinale(msg);
                    break;
            }
        }

        function handleQuestionStarted(msg) {
            showView('question');
            els.funFact.classList.remove('visible');

            els.roundIndicator.textContent = window.QuizifyI18n
                ? window.QuizifyI18n.t('dashboard.questionCounter', { current: msg.round_num, total: msg.total_rounds })
                : 'Question ' + msg.round_num + ' / ' + msg.total_rounds;
            els.questionCategory.textContent = msg.category || '';
            els.questionText.textContent = msg.question_text;
            renderQuestionImage(msg.image_url);

            timerDuration = msg.timer_duration || 30;
            timerRemaining = timerDuration;
            els.timerFill.style.width = '100%';
            els.timerFill.className = 'dashboard-timer-fill';

            // Render answers
            var labels = ['A', 'B', 'C', 'D'];
            currentAnswers = msg.answers || [];
            els.answersGrid.innerHTML = currentAnswers.map(function(text, i) {
                // Distribution markup is included up-front but kept hidden via
                // the .revealed class on the parent (issue #151). Embedding it
                // at question-render time avoids a DOM thrash at reveal — only
                // the fill-width + percent-text change.
                return '<div class="dashboard-answer" data-index="' + i + '">' +
                    '<span class="answer-label">' + (labels[i] || '') + '</span>' +
                    '<span class="answer-text">' + escapeHtml(text) + '</span>' +
                    '<div class="dashboard-answer-distribution" aria-hidden="true">' +
                        '<div class="dashboard-answer-bar"><div class="dashboard-answer-bar-fill"></div></div>' +
                        '<span class="dashboard-answer-percent">0%</span>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        function handleTimerTick(msg) {
            timerRemaining = msg.remaining;
            var pct = timerDuration > 0 ? (timerRemaining / timerDuration) * 100 : 0;
            els.timerFill.style.width = pct + '%';

            els.timerFill.className = 'dashboard-timer-fill';
            if (timerRemaining <= 5) {
                els.timerFill.classList.add('critical');
            } else if (timerRemaining <= 10) {
                els.timerFill.classList.add('warning');
            }
        }

        function handleRoundSummary(msg) {
            var summary = msg.round_summary || msg;

            // Highlight correct answer.
            // We prefer the ORIGINAL-order index when the server sends it
            // (added 2026-05-29 in v1.1.47): the dashboard renders an
            // unshuffled answer-grid, so the per-player canonical shuffle
            // map would point at the wrong tile. Old payloads without the
            // field fall back to the existing canonical index — that's the
            // pre-fix behavior, only slightly wrong, so the UI doesn't
            // break on stale clients.
            var correctIdx = summary.correct_answer_index_original;
            if (correctIdx == null || correctIdx < 0) {
                correctIdx = summary.correct_answer_index != null ? summary.correct_answer_index : -1;
            }
            var answerEls = els.answersGrid.querySelectorAll('.dashboard-answer');

            // Issue #151: render live answer distribution at reveal.
            // Server sends [{index, count, percent}, ...]; empty when no one
            // submitted. The .revealed class triggers the CSS fade-in; bar
            // fill widths animate from 0 % to their target. Tabular-num
            // percent text avoids width-jitter as the value updates.
            var distByIdx = {};
            (summary.answer_distribution || []).forEach(function(d) {
                if (d && typeof d.index === 'number') distByIdx[d.index] = d;
            });

            answerEls.forEach(function(el) {
                var idx = parseInt(el.dataset.index, 10);
                if (idx === correctIdx) {
                    el.classList.add('correct');
                } else {
                    el.classList.add('wrong');
                }
                el.classList.add('revealed');

                var entry = distByIdx[idx];
                var pct = (entry && typeof entry.percent === 'number') ? entry.percent : 0;
                var fill = el.querySelector('.dashboard-answer-bar-fill');
                var pctEl = el.querySelector('.dashboard-answer-percent');
                if (fill) fill.style.width = pct + '%';
                if (pctEl) pctEl.textContent = pct + '%';
            });

            // Fun fact
            var fact = summary.fun_fact || '';
            if (fact) {
                els.funFactText.textContent = fact;
                setTimeout(function() { els.funFact.classList.add('visible'); }, 300);
            }

            // Leaderboard
            var lb = summary.leaderboard || msg.leaderboard || [];
            if (lb.length) renderLeaderboard(els.leaderboard, lb);
        }

        function handleFinale(msg) {
            showView('finale');

            var podium = msg.podium || [];
            renderPodium(podium);

            var lb = msg.leaderboard || msg.all_players || [];
            renderLeaderboard(els.finaleLeaderboard, lb);

            renderAwards(msg.superlatives || []);

            // Soft Parlor: no confetti. The warm pause IS the effect. See DESIGN.md.
        }

        // ---- Renderers ----
        function renderLeaderboard(container, players) {
            if (!container || !players) return;
            // Show top 5 in game view, all in finale
            var list = container === els.leaderboard ? players.slice(0, 5) : players;
            container.innerHTML = list.map(function(p, i) {
                var rank = p.rank || i + 1;
                var rankClass = rank <= 3 ? ' rank-' + rank : '';
                return '<div class="leaderboard-row">' +
                    '<span class="leaderboard-rank' + rankClass + '">' + rank + '</span>' +
                    '<span class="leaderboard-name">' + escapeHtml(p.name) + '</span>' +
                    '<span class="leaderboard-score">' + p.score + '</span>' +
                    (p.streak > 1 ? '<span class="leaderboard-streak">' + p.streak + 'x</span>' : '') +
                    '</div>';
            }).join('');
        }

        function renderPodium(podium) {
            // Per Markus 2026-05-29 (msg 320): names + medal + score sit on
            // TOP of each podium column (in a flex label wrapper), bar at
            // bottom. With `justify-content: space-between` on .podium-place
            // and a fixed total height, labels align across columns and
            // bars share a baseline.
            var ordered = [];
            if (podium[1]) ordered.push({ name: podium[1].name, score: podium[1].score, place: 2 });
            if (podium[0]) ordered.push({ name: podium[0].name, score: podium[0].score, place: 1 });
            if (podium[2]) ordered.push({ name: podium[2].name, score: podium[2].score, place: 3 });

            var medals = { 1: '\uD83E\uDD47', 2: '\uD83E\uDD48', 3: '\uD83E\uDD49' };
            var barClass = { 1: 'first', 2: 'second', 3: 'third' };

            var ptsLabel = window.QuizifyI18n ? window.QuizifyI18n.t('dashboard.pointsShort') : 'pts';
            els.podium.innerHTML = ordered.map(function(p) {
                return '<div class="podium-place">' +
                    '<div class="podium-label">' +
                        '<div class="podium-avatar">' + (medals[p.place] || '') + '</div>' +
                        '<div class="podium-name">' + escapeHtml(p.name) + '</div>' +
                        '<div class="podium-score">' + p.score + ' ' + ptsLabel + '</div>' +
                    '</div>' +
                    '<div class="podium-bar ' + (barClass[p.place] || '') + '">' + p.place + '</div>' +
                    '</div>';
            }).join('');

            // Render players 4+ in the side panel.
            var othersEl = document.getElementById('podium-others');
            if (!othersEl) return;
            var others = podium.slice(3);
            if (!others.length) {
                othersEl.setAttribute('hidden', '');
                othersEl.innerHTML = '';
                return;
            }
            othersEl.removeAttribute('hidden');
            var title = window.QuizifyI18n ? window.QuizifyI18n.t('dashboard.runnersUp') : 'Also playing';
            othersEl.innerHTML = '<div class="podium-others-title">' + escapeHtml(title) + '</div>' +
                others.map(function(p, i) {
                    var rank = i + 4;  // 4th, 5th, \u2026
                    return '<div class="podium-other-row">' +
                        '<span class="podium-other-rank">#' + rank + '</span>' +
                        '<span class="podium-other-name">' + escapeHtml(p.name) + '</span>' +
                        '<span class="podium-other-score">' + p.score + '</span>' +
                    '</div>';
                }).join('');
        }

        function renderAwards(superlatives) {
            var section = document.getElementById('awards-section');
            if (!section || !superlatives || !superlatives.length) {
                if (section) section.classList.add('hidden');
                return;
            }
            section.classList.remove('hidden');
            var awardsLabel = window.QuizifyI18n ? window.QuizifyI18n.t('dashboard.awards') : 'Awards';
            section.innerHTML = '<div class="awards-title">' + escapeHtml(awardsLabel) + '</div><div class="awards-grid"></div>';
            var grid = section.querySelector('.awards-grid');

            superlatives.forEach(function(s, i) {
                var card = document.createElement('div');
                card.className = 'award-card';
                card.style.animationDelay = (i * 0.5) + 's';
                // Compact pill layout (Markus 2026-05-29 msg 323): icon
                // owns the left chip, award-name + winner share one line,
                // detail wraps as a quiet sub-line.
                card.innerHTML =
                    '<div class="award-icon">' + s.icon + '</div>' +
                    '<div class="award-text">' +
                        '<div class="award-name">' + escapeHtml(s.award) + ' · <span class="award-winner">' + escapeHtml(s.winner) + '</span></div>' +
                        '<div class="award-detail">' + escapeHtml(s.detail) + '</div>' +
                    '</div>';
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            var el = document.createElement('span');
            el.textContent = text || '';
            return el.innerHTML;
        }

        // ---- Init ----
        if (window.QuizifyI18n && typeof window.QuizifyI18n.init === 'function') {
            window.QuizifyI18n.init(window.QuizifyI18n.getPreferredLanguage()).then(function () {
                window.QuizifyI18n.initPageTranslations(document);
            });
        }
        connect();
    })();
    </script>
    <script src="/quizify/static/js/sw-update.js?v={{ASSET_VER}}"></script>
</body>
</html>
