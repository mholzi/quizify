<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quizify</title>
    <link rel="stylesheet" href="/quizify/static/css/styles.css">
    <link rel="icon" href="/quizify/static/img/icon-256.png" type="image/png">
    <link rel="manifest" href="/quizify/static/site.webmanifest">
</head>
<body>
    <div class="app-container">
        <div class="launcher-content">
            <div>
                <h1 class="launcher-title">
                    <span class="wordmark-quiz">Quiz</span><span class="wordmark-ify">ify</span>
                </h1>
                <p class="subtitle">Das unnütze Wissen Quiz</p>
            </div>

            <div id="game-status" class="hidden">
                <span class="game-status-badge">
                    <span class="dot"></span>
                    <span id="status-text">Spiel läuft</span>
                </span>
            </div>

            <div class="launcher-buttons">
                <a href="/quizify/player" class="btn btn-primary btn-block btn-lg">Spiel beitreten</a>
                <a href="/quizify/admin" class="btn btn-secondary btn-block btn-lg">Admin</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Check if a game is currently running
            fetch('/api/quizify/game-status')
                .then(r => r.json())
                .then(data => {
                    if (data && data.phase && data.phase !== 'LOBBY') {
                        document.getElementById('game-status').classList.remove('hidden');
                        const phases = {
                            QUESTION_ACTIVE: 'Spiel läuft — Frage aktiv',
                            ANSWER_REVEAL: 'Spiel läuft — Auflösung',
                            FINALE: 'Spiel beendet',
                        };
                        document.getElementById('status-text').textContent =
                            phases[data.phase] || 'Spiel läuft';
                    }
                })
                .catch(() => {});
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/quizify/static/sw.js");
        }
    </script>
</body>
</html>
