<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="quizify-version" content="{{VERSION}}">
    <!-- Home Assistant's configured language; the launcher follows it so it
         doesn't flash English then flip to the browser language. -->
    <meta name="quizify-ha-lang" content="{{HA_LANG}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="launcher.title">Quizify</title>
    <!-- Fonts are self-hosted under /quizify/static/fonts/ (#737, #738): no
         third-party request on load, nothing foreign blocking the first paint.
         Preload the two faces every screen uses so they download alongside the
         stylesheet instead of after it. -->
    <link rel="preload" as="font" type="font/woff2" href="/quizify/static/fonts/dm-sans-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/quizify/static/fonts/jetbrains-mono-latin.woff2" crossorigin>
    <style>
        /* The launcher is self-contained — it does not pull styles.css — so it
           carries its own @font-face declarations for the self-hosted faces
           (#737, #738). Same files the other screens use, so the browser cache
           is shared. font-display: swap keeps text visible while they load. */
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url('/quizify/static/fonts/dm-sans-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url('/quizify/static/fonts/dm-sans-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('/quizify/static/fonts/jetbrains-mono-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('/quizify/static/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        :root {
            /* Soft Parlor launcher tokens */
            --color-bg-primary: #FAF6EC;
            --color-accent-primary: #E88A7F;
            --color-accent-secondary: #7FA897;
            --color-text-primary: #2A2820;
            --color-text-muted: #6E6A5C;
            --color-surface-dark: #FFFFFF;
            --color-border-neon: #E5DFCF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background: var(--color-bg-primary);
            background-image:
                radial-gradient(ellipse at 85% 15%, rgba(232, 138, 127, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 15% 85%, rgba(127, 168, 196, 0.08) 0%, transparent 55%);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .logo {
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            line-height: 1;
        }

        .logo .quiz {
            color: var(--color-text-primary);
        }

        .logo .ify {
            color: var(--color-accent-primary);
        }

        .message {
            font-size: 17px;
            color: var(--color-text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
            max-width: 440px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: var(--color-accent-primary);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 10px;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0.02em;
            transition: transform 120ms ease-out, box-shadow 120ms ease-out;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 16px rgba(232, 138, 127, 0.32);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(232, 138, 127, 0.42);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            font-size: 18px;
        }

        .hint {
            margin-top: 24px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--color-text-muted);
            min-height: 20px;
            letter-spacing: 0.02em;
        }

        .status {
            margin-top: 12px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: var(--color-text-muted);
            opacity: 0.5;
            letter-spacing: 0.12em;
            text-transform: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .opening {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="quiz">Quiz</span><span class="ify">ify</span>
    </div>
    <p class="message" id="message" data-i18n="launcher.clickToLaunch">Launch the quiz in fullscreen — no distractions.</p>
    <!-- Plain anchor instead of <button onclick="window.open(...)">. The
         button was a dead-end inside the Android HA companion WebView (and
         any embedded browser that blocks popups): window.open returned
         non-null but never actually opened a tab, and the "click here"
         fallback link inside the blocked-message had target="_blank" which
         hit the same block. With <a href> the browser does its native
         navigation — works in WebView, on iOS Safari, and on desktop.
         Android Companion (#348) is the exception — see the click handler
         below; target="_blank" is silently swallowed there. -->
    <a class="btn" id="openBtn" href="/quizify/admin" target="_blank" rel="noopener">
        <span class="btn-icon">🧠</span>
        <span data-i18n="launcher.openQuizify">Open Quizify</span>
    </a>
    <p class="hint" id="hint"></p>

    <script src="/quizify/static/js/i18n.js?v={{ASSET_VER}}"></script>
    <script>
        // The launcher is a plain `<a target="_blank">`, which works
        // everywhere EXCEPT the Android HA Companion App (#348, ported from
        // beatify#1114). There the WebView swallows target="_blank"
        // silently — no external tab opens, the button just does nothing.
        // We detect the Companion Android UA and navigate `window.location`
        // (the current iframe) to the admin URL directly, bypassing both
        // the dead target="_blank" and HA's SPA router.
        //
        // Why window.location and not window.top? HA's SPA registers the
        // panel under the `/quizify/*` path prefix. Navigating the top
        // frame to `/quizify/admin` makes HA's router re-load the Quizify
        // panel (which iframes `/quizify/launcher`), bouncing the user back
        // here. Navigating the iframe itself skips HA's router — the
        // backend serves the admin HTML straight into the panel frame.
        // Trade-off: admin runs inside HA's chrome rather than fullscreen,
        // but it is fully functional. iOS Companion / desktop / standalone
        // browsers keep the native target="_blank" fullscreen behaviour.

        function isAndroidCompanion() {
            var ua = navigator.userAgent || '';
            return /Android/i.test(ua) && /Home ?Assistant/i.test(ua);
        }

        window.addEventListener('load', async function () {
            var openBtn = document.getElementById('openBtn');
            if (openBtn) openBtn.addEventListener('click', function (evt) {
                // Android Companion: bypass the dead target="_blank" —
                // navigate the current iframe so Quizify actually loads.
                if (isAndroidCompanion()) {
                    evt.preventDefault();
                    window.location.href = '/quizify/admin';
                }
                // Every other context lets target="_blank" do its job.
            });

            await QuizifyI18n.init(QuizifyI18n.getPreferredLanguage());
            QuizifyI18n.initPageTranslations();
        });
    </script>
</body>
</html>
