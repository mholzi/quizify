<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="quizify-version" content="{{VERSION}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="launcher.title">Quizify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Soft Parlor launcher tokens */
            --color-bg-primary: #FAF6EC;
            --color-accent-primary: #E88A7F;
            --color-accent-secondary: #7FA897;
            --color-text-primary: #2A2820;
            --color-text-muted: #6E6A5C;
            --color-surface-dark: #FFFFFF;
            --color-border-neon: #E5DFCF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background: var(--color-bg-primary);
            background-image:
                radial-gradient(ellipse at 85% 15%, rgba(232, 138, 127, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 15% 85%, rgba(127, 168, 196, 0.08) 0%, transparent 55%);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .logo {
            font-family: 'Cabinet Grotesk', system-ui, sans-serif;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            line-height: 1;
        }

        .logo .quiz {
            color: var(--color-text-primary);
        }

        .logo .ify {
            color: var(--color-accent-primary);
        }

        .message {
            font-size: 17px;
            color: var(--color-text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
            max-width: 440px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: var(--color-accent-primary);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 10px;
            font-family: 'Cabinet Grotesk', system-ui, sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0.02em;
            transition: transform 120ms ease-out, box-shadow 120ms ease-out;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 16px rgba(232, 138, 127, 0.32);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(232, 138, 127, 0.42);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            font-size: 18px;
        }

        .hint {
            margin-top: 24px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--color-text-muted);
            min-height: 20px;
            letter-spacing: 0.02em;
        }

        .status {
            margin-top: 12px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: var(--color-text-muted);
            opacity: 0.5;
            letter-spacing: 0.12em;
            text-transform: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .opening {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="quiz">Quiz</span><span class="ify">ify</span>
    </div>
    <p class="message" id="message" data-i18n="launcher.clickToLaunch">Launch the quiz in fullscreen — no distractions.</p>
    <!-- Plain anchor instead of <button onclick="window.open(...)">. The
         button was a dead-end inside the Android HA companion WebView (and
         any embedded browser that blocks popups): window.open returned
         non-null but never actually opened a tab, and the "click here"
         fallback link inside the blocked-message had target="_blank" which
         hit the same block. With <a href> the browser does its native
         navigation — works in WebView, on iOS Safari, and on desktop. -->
    <a class="btn" id="openBtn" href="/quizify/admin" target="_blank" rel="noopener">
        <span class="btn-icon">🧠</span>
        <span data-i18n="launcher.openQuizify">Open Quizify</span>
    </a>
    <p class="hint" id="hint"></p>

    <script src="/quizify/static/js/i18n.js?v={{VERSION}}"></script>
    <script>
        // i18n only — navigation is handled by the <a href>. No popup
        // attempt, no fallback ladder. The launcher is now stateless.
        window.addEventListener('load', async function () {
            await QuizifyI18n.init();
            QuizifyI18n.initPageTranslations();
        });
    </script>
</body>
</html>
