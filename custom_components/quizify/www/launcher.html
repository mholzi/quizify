<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="launcher.title">Quizify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Broadcast Living Room launcher tokens */
            --color-bg-primary: #0B1739;
            --color-accent-primary: #F4C430;
            --color-accent-secondary: #F4C430;
            --color-text-primary: #F4EBCF;
            --color-text-muted: #8FA0C6;
            --color-surface-dark: #142148;
            --color-border-neon: #21305E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
            background: var(--color-bg-primary);
            background-image:
                linear-gradient(var(--color-bg-primary), var(--color-bg-primary)),
                repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px, transparent 3px);
            background-blend-mode: overlay;
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .logo {
            font-family: 'Unbounded', system-ui, sans-serif;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            line-height: 1;
        }

        .logo .quiz {
            color: var(--color-text-primary);
        }

        .logo .ify {
            color: var(--color-accent-primary);
        }

        .message {
            font-size: 17px;
            color: var(--color-text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
            max-width: 440px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: var(--color-accent-primary);
            color: var(--color-bg-primary);
            text-decoration: none;
            border-radius: 10px;
            font-family: 'Unbounded', system-ui, sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: transform 120ms ease-out, box-shadow 120ms ease-out;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 32px rgba(244, 196, 48, 0.35);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 40px rgba(244, 196, 48, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            font-size: 18px;
        }

        .hint {
            margin-top: 24px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--color-text-muted);
            min-height: 20px;
            letter-spacing: 0.06em;
        }

        .status {
            margin-top: 12px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: var(--color-text-muted);
            opacity: 0.5;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .opening {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="quiz">Quiz</span><span class="ify">ify</span>
    </div>
    <p class="message" id="message" data-i18n="launcher.clickToLaunch">Launch the quiz in fullscreen — no distractions.</p>
    <button class="btn" id="openBtn" onclick="openQuizify()">
        <span class="btn-icon">🧠</span>
        <span data-i18n="launcher.openQuizify">Open Quizify</span>
    </button>
    <p class="hint" id="hint"></p>
    <p class="status" id="status"></p>

    <script src="/quizify/static/js/i18n.js"></script>
    <script>
        var quizifyWindow = null;

        function openQuizify() {
            var adminUrl = window.location.origin + '/quizify/admin';

            // If we already have an open window, focus it
            if (quizifyWindow && !quizifyWindow.closed) {
                quizifyWindow.focus();
                updateUI('focused');
                return;
            }

            var messageEl = document.getElementById('message');
            messageEl.classList.add('opening');

            quizifyWindow = window.open(adminUrl, 'quizify_game', 'noopener');

            if (quizifyWindow) {
                updateUI('opened');
            } else {
                updateUI('blocked');
            }
        }

        function updateUI(state) {
            var messageEl = document.getElementById('message');
            var hintEl = document.getElementById('hint');
            var btnEl = document.getElementById('openBtn');
            messageEl.classList.remove('opening');

            if (state === 'opened') {
                messageEl.textContent = QuizifyI18n.t('launcher.openedInNewTab') || 'Quizify is running in a new tab! 🧠';
                hintEl.textContent = QuizifyI18n.t('launcher.clickToFocus') || 'Click again to focus the game tab';
                btnEl.querySelector('[data-i18n]').textContent = QuizifyI18n.t('launcher.focusQuizify') || 'Focus Quizify';
            } else if (state === 'focused') {
                messageEl.textContent = QuizifyI18n.t('launcher.focusedTab') || 'Switched to Quizify tab! 🎯';
            } else if (state === 'blocked') {
                messageEl.textContent = QuizifyI18n.t('launcher.popupBlocked') || 'Pop-up was blocked by your browser.';
                hintEl.innerHTML = QuizifyI18n.t('launcher.allowPopups') || 'Allow pop-ups for this site, or <a href="' + window.location.origin + '/quizify/admin" target="_blank" style="color: var(--color-accent-secondary);">click here</a> to open directly.';
            }
        }

        // Initialize i18n
        window.addEventListener('load', async function() {
            await QuizifyI18n.init();
            QuizifyI18n.initPageTranslations();
        });
    </script>
</body>
</html>
