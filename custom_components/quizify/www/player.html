<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quizify — Player</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/quizify/static/css/styles.css">
    <link rel="icon" href="/quizify/static/img/icon-256.png" type="image/png">
    <link rel="manifest" href="/quizify/static/site.webmanifest">
</head>
<body class="theme-dark">
    <!-- Timer bar (fixed top, outside app-container) -->
    <div id="timer-bar" class="timer-bar-container hidden">
        <div class="timer-bar-fill"></div>
    </div>

    <div class="app-container">
        <header class="player-header">
            <h1 class="wordmark">
                <span class="wordmark-quiz">Quiz</span><span class="wordmark-ify">ify</span>
            </h1>
        </header>

        <main class="player-container">
            <!-- ========== LOBBY VIEW ========== -->
            <div id="lobby-view" class="view active">
                <div class="lobby-content">
                    <div id="join-section" class="join-form">
                        <p class="text-muted" data-i18n="lobby.enterName">Gib deinen Namen ein</p>
                        <input type="text" id="name-input" class="name-input" placeholder="Dein Name" maxlength="20"
                               autocomplete="off" autocapitalize="words">
                        <button id="join-btn" class="btn btn-primary btn-glow join-btn" disabled data-i18n="lobby.joinBtn">Beitreten</button>
                    </div>

                    <div id="waiting-section" class="hidden">
                        <p class="waiting-message" data-i18n="lobby.waitingForHost">Warte auf den Host...</p>
                        <div class="player-list mt-lg">
                            <div class="player-list-header">
                                <span class="card-header">Spieler</span>
                                <span id="player-count" class="player-count">0</span>
                            </div>
                            <div id="player-chips" class="player-chips"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== QUESTION VIEW ========== -->
            <div id="question-view" class="view">
                <div id="timer-bar-text" class="timer-text"></div>
                <div class="question-area">
                    <div id="round-indicator" class="round-indicator"></div>
                    <div id="question-text" class="question-text"></div>
                    <div id="question-category" class="question-category"></div>
                </div>
                <div id="powerup-bar" class="powerup-bar hidden">
                    <button id="powerup-btn" class="powerup-btn">
                        <span id="powerup-icon"></span>
                        <span id="powerup-label"></span>
                    </button>
                </div>
                <div id="answers-container" class="answers-container"></div>
            </div>

            <!-- ========== REVEAL VIEW ========== -->
            <div id="reveal-view" class="view">
                <div class="question-area">
                    <div id="reveal-question" class="question-text reveal-question-text"></div>
                </div>
                <div id="reveal-answers" class="answers-container"></div>
                <div class="score-display">
                    <div id="points-earned" class="points-earned"></div>
                    <div id="score-detail" class="score-detail"></div>
                    <div id="streak-badge" class="streak-badge hidden"></div>
                    <div id="rank-display" class="rank-display"></div>
                </div>
                <div id="fun-fact" class="fun-fact-card hidden">
                    <div class="fun-fact-label">Wusstest du?</div>
                    <div class="fun-fact-text"></div>
                </div>
            </div>

            <!-- ========== FINALE VIEW ========== -->
            <div id="finale-view" class="view">
                <div class="podium-section">
                    <div class="podium-title" data-i18n="podium.title">Ergebnis</div>
                    <div id="podium" class="podium"></div>
                </div>
                <div id="awards-section" class="awards-section hidden"></div>
                <div class="card">
                    <div class="card-header" data-i18n="leaderboard.title">Rangliste</div>
                    <div id="finale-leaderboard" class="leaderboard"></div>
                </div>
                <div class="finale-actions">
                    <button id="copy-result-btn" class="btn btn-secondary" style="display:none;">
                        <span data-i18n="finale.copyResult">Ergebnis kopieren</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/quizify/static/js/i18n.js"></script>
    <script src="/quizify/static/js/utils.js"></script>
    <script src="/quizify/static/js/timer.js"></script>
    <script src="/quizify/static/js/answers.js"></script>
    <script src="/quizify/static/js/fun-fact.js"></script>
    <script src="/quizify/static/js/player.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/quizify/static/sw.js");
        }
    </script>
</body>
</html>
