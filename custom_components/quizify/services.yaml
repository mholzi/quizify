reset_admin_session:
  name: Reset admin session
  description: >-
    Wipe the persisted admin session token. Use this if you can't access
    the admin panel because the saved token is out of sync (e.g. browser
    cleared, persistent storage edited externally). The next admin
    connection will bootstrap a fresh token. Only callable by HA admins.
  fields: {}

start_game:
  name: Start game
  description: >-
    Start a new Quizify game. Wire it to an Assist sentence ("Hey Nabu, start
    the quiz"), a Zigbee remote button or a dashboard button so the host can
    kick off the game without reaching for the admin panel. With no fields set
    it repeats the settings of your last game; name a saved preset, or set the
    individual fields, to start a different one. Only works from the lobby —
    it will not interrupt a game already in progress.
  fields:
    preset:
      name: Preset
      description: >-
        The name of a preset saved in the Quizify setup screen. Its packs,
        difficulty, rounds, timer and game-mode toggles are applied; the fields
        below still win over it.
      required: false
      example: Friday night
      selector:
        text:
    category:
      name: Packs
      description: >-
        One question pack, a list of them, or "mixed" for all packs.
      required: false
      example: geography
      selector:
        text:
          multiple: true
    difficulty:
      name: Difficulty
      description: >-
        Fixed difficulty for the whole game, or "auto" to let Quizify calibrate
        it to the group. Leave empty to keep your last setting.
      required: false
      selector:
        select:
          options:
            - easy
            - medium
            - hard
            - auto
            - mixed
          custom_value: true
    num_rounds:
      name: Rounds
      description: How many questions the game runs for.
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 50
          mode: box
    language:
      name: Language
      description: >-
        Language code for the questions and the player screens, e.g. "de",
        "en" or "es".
      required: false
      example: de
      selector:
        text:
    timer_duration:
      name: Timer
      description: >-
        Seconds each question stays open. Leave empty for the difficulty's
        default.
      required: false
      example: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
          mode: box

next_round:
  name: Next question
  description: >-
    Advance to the next question — the same action as the admin "Next" button.
    Handy on a Zigbee remote or via Assist ("Hey Nabu, next question") so the
    host can move the game along from across the room. Only valid once the
    current question has been revealed (or to start the first round).
  fields: {}

pause:
  name: Pause game
  description: >-
    Pause the active question, freezing every player's timer. Useful for a
    quick break, mapped to a remote button, dashboard button or Assist
    sentence. Only works while a question is running.
  fields: {}

resume:
  name: Resume game
  description: >-
    Resume a paused game and restart the countdown. Pair it with the pause
    service on a remote/automation. Only works when the game is currently
    paused.
  fields: {}

end_game:
  name: End game
  description: >-
    End the current game immediately and jump to the final leaderboard. Wire
    it to a remote button, dashboard button or Assist sentence ("Hey Nabu, end
    the quiz"). Only works while a game is running.
  fields: {}

reload_packs:
  name: Reload question packs
  description: >-
    Re-read every question pack from disk, including the community packs you
    dropped into the "quizify/packs" folder of your Home Assistant config
    directory. Use it after adding, editing or removing a pack so it shows up
    in the picker without restarting Home Assistant. Only works from the
    lobby — a running game keeps the packs it started with.
  fields: {}
