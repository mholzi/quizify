blueprint:
  name: Quizify - Flash lights on the answer reveal
  description: >-
    Flashes your lights when Quizify reveals an answer: one colour if most of
    the room got it right, another if most got it wrong.


    Needs the option **The House Plays Along** switched on (Settings > Devices
    & services > Quizify > Configure), otherwise Quizify fires no events.
  domain: automation
  author: mholzi
  min_version: 2024.10.0
  source_url: https://raw.githubusercontent.com/mholzi/quizify/main/blueprints/automation/mholzi/quizify_flash_lights_on_reveal.yaml
  input:
    lights:
      name: Lights
      description: The lights that flash on every reveal.
      selector:
        entity:
          domain: light
          multiple: true
    right_colour:
      name: Colour when the room was mostly right
      default: [0, 200, 80]
      selector:
        color_rgb:
    wrong_colour:
      name: Colour when the room was mostly wrong
      default: [220, 40, 40]
      selector:
        color_rgb:
    right_threshold:
      name: "Share of correct answers that counts as mostly right"
      description: Percent of the players who answered correctly.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    flash_length:
      name: Flash length
      default: short
      selector:
        select:
          options:
            - short
            - long

mode: restart
max_exceeded: silent

variables:
  right_threshold: !input right_threshold
  right_colour: !input right_colour
  wrong_colour: !input wrong_colour
  total_players: "{{ trigger.event.data.total_players | int(0) }}"
  correct_count: "{{ trigger.event.data.correct_count | int(0) }}"
  mostly_right: >-
    {{ total_players > 0 and
       (correct_count * 100 / total_players) >= (right_threshold | float(50)) }}

triggers:
  - trigger: event
    event_type: quizify_answer_revealed

actions:
  - action: light.turn_on
    target:
      entity_id: !input lights
    data:
      rgb_color: "{{ right_colour if mostly_right else wrong_colour }}"
      flash: !input flash_length
