name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp voluptuous pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

      - name: Byte-compile component (catches syntax errors)
        run: |
          python -m compileall -q custom_components/quizify
