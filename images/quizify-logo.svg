<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Full-word gradient: white → purple → pink → cyan -->
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="72%"  stop-color="#a855f7"/>
      <stop offset="85%"  stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="#0d0e1a" rx="18"/>

  <!-- Icon circle -->
  <circle cx="100" cy="100" r="82" fill="#1a1c35"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#qGrad)" stroke-width="1" opacity="0.35"/>

  <!-- Q letter -->
  <g filter="url(#glow)">
    <circle cx="89" cy="95" r="40" fill="none" stroke="url(#qGrad)" stroke-width="18" stroke-linecap="round"/>
    <line x1="114" y1="124" x2="140" y2="153" stroke="url(#qGrad)" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Answer dots (A B C D choices) -->
  <circle cx="152" cy="57"  r="6.5" fill="url(#dotGrad)" opacity="0.95"/>
  <circle cx="152" cy="80"  r="6.5" fill="url(#dotGrad)" opacity="0.72"/>
  <circle cx="152" cy="103" r="6.5" fill="url(#dotGrad)" opacity="0.48"/>
  <circle cx="152" cy="126" r="6.5" fill="url(#dotGrad)" opacity="0.28"/>

  <!-- Wordmark — single text element, one gradient across full word -->
  <text
    x="205"
    y="138"
    font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif"
    font-weight="900"
    font-size="104"
    letter-spacing="-2"
    fill="url(#wordGrad)"
  >Quizify</text>
</svg>
